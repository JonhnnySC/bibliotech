spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bibliotech}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}


spring.config.import=optional:file:.env[.properties]

#pra solucionar quebra no front-end, quando o front tenta acessar um objeto lazy carregado fora de uma transação
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security=INFO

#segredos do .envg
app.admin.senha-promocao=${ADMIN_PROMOTION_PASSWORD:}
app.bootstrap.key=${BOOTSTRAP_KEY:}
app.cadastro.codigo-admin=${CODIGO_ADMIN:}
app.cadastro.codigo-bibliotecario=${CODIGO_BIBLIOTECARIO:}


#swagger nao tava inciializando, forçar versao 3.0
springdoc.api-docs.version=OPENAPI_3_0

server.port=8080


